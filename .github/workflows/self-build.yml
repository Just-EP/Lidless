name: Build Chinese Self-Use DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/prepare_self_build.py'
      - '.github/scripts/fix_self_status.py'
      - '.github/scripts/fix_external_notice.py'
      - '.github/workflows/self-build.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Apply Chinese self-build patch
        run: python3 .github/scripts/prepare_self_build.py .

      - name: Fix self-build status row
        run: |
          python3 .github/scripts/fix_self_status.py
          grep -F 'Text("自用模式已启用")' Sources/Lidless/MenuContent.swift

      - name: Fix external sleep warning
        run: |
          python3 .github/scripts/fix_external_notice.py
          grep -F 'return L10n.tr("Sleep prevention was turned off outside Lidless.")' Sources/Shared/StateReconciler.swift
          grep -F 'if origin == .auto, target { externalNotice = nil }' Sources/Lidless/AppState.swift
          grep -F '"Sleep prevention was turned off outside Lidless." = "检测到 Lidless 之外关闭了防休眠。";' Resources/zh-Hans.lproj/Localizable.strings

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test patched sources
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Lidless-CI \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Build release app
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Lidless \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Embed and verify Chinese localization
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Lidless.app"
          PLIST="$APP/Contents/Info.plist"
          SRC="$PWD/Resources/zh-Hans.lproj/Localizable.strings"
          DST="$APP/Contents/Resources/zh-Hans.lproj"

          test -d "$APP"
          test -s "$SRC"
          mkdir -p "$DST"
          cp "$SRC" "$DST/Localizable.strings"

          /usr/libexec/PlistBuddy -c 'Delete :CFBundleLocalizations' "$PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Add :CFBundleLocalizations array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleLocalizations:0 string zh-Hans' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDevelopmentRegion zh-Hans' "$PLIST" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDevelopmentRegion string zh-Hans' "$PLIST"

          test -s "$DST/Localizable.strings"
          /usr/bin/plutil -lint "$DST/Localizable.strings"
          /usr/bin/grep -F '"Keep awake with lid closed" = "合盖保持唤醒";' "$DST/Localizable.strings"
          /usr/bin/grep -F '"Safety" = "安全";' "$DST/Localizable.strings"
          /usr/bin/grep -F '"Settings…" = "设置…";' "$DST/Localizable.strings"
          /usr/bin/grep -F '"Sleep prevention was turned off outside Lidless." = "检测到 Lidless 之外关闭了防休眠。";' "$DST/Localizable.strings"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations:0' "$PLIST" | grep -Fx 'zh-Hans'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDevelopmentRegion' "$PLIST" | grep -Fx 'zh-Hans'

          cat > /tmp/check_l10n.swift <<'SWIFT'
          import Foundation
          let app = CommandLine.arguments[1]
          guard let bundle = Bundle(path: app) else { fatalError("cannot open app bundle") }
          guard bundle.localizations.contains("zh-Hans") else {
              fatalError("Bundle does not advertise zh-Hans: \(bundle.localizations)")
          }
          guard let path = bundle.path(forResource: "Localizable", ofType: "strings", inDirectory: nil, forLocalization: "zh-Hans") else {
              fatalError("zh-Hans Localizable.strings is not visible through Bundle")
          }
          let dict = NSDictionary(contentsOfFile: path) as? [String: String] ?? [:]
          guard dict["Keep awake with lid closed"] == "合盖保持唤醒" else { fatalError("primary toggle translation missing") }
          guard dict["Safety"] == "安全" else { fatalError("safety translation missing") }
          guard dict["Settings…"] == "设置…" else { fatalError("settings translation missing") }
          guard dict["Sleep prevention was turned off outside Lidless."] == "检测到 Lidless 之外关闭了防休眠。" else { fatalError("external-off translation missing") }
          let main = bundle.localizedString(forKey: "Keep awake with lid closed", value: "Keep awake with lid closed", table: nil)
          let safety = bundle.localizedString(forKey: "Safety", value: "Safety", table: nil)
          let settings = bundle.localizedString(forKey: "Settings…", value: "Settings…", table: nil)
          let externalOff = bundle.localizedString(forKey: "Sleep prevention was turned off outside Lidless.", value: "Sleep prevention was turned off outside Lidless.", table: nil)
          guard main == "合盖保持唤醒" else { fatalError("resolved primary toggle is not Chinese: \(main)") }
          guard safety == "安全" else { fatalError("resolved safety is not Chinese: \(safety)") }
          guard settings == "设置…" else { fatalError("resolved settings is not Chinese: \(settings)") }
          guard externalOff == "检测到 Lidless 之外关闭了防休眠。" else { fatalError("resolved external-off notice is not Chinese: \(externalOff)") }
          SWIFT
          /usr/bin/swift /tmp/check_l10n.swift "$APP"

      - name: Ad-hoc sign and package
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Lidless.app"
          test -d "$APP"
          test -s "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          rm -rf dist
          mkdir -p dist/stage
          cp -R "$APP" dist/stage/
          ln -s /Applications dist/stage/Applications

          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Lidless-zh-Hans-self.zip
          hdiutil create \
            -volname 'Lidless 中文自用版' \
            -srcfolder dist/stage \
            -ov -format UDZO \
            dist/Lidless-zh-Hans-self.dmg

          unzip -l dist/Lidless-zh-Hans-self.zip | grep -F 'Lidless.app/Contents/Resources/zh-Hans.lproj/Localizable.strings'
          shasum -a 256 dist/Lidless-zh-Hans-self.zip dist/Lidless-zh-Hans-self.dmg > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload app and DMG
        uses: actions/upload-artifact@v4
        with:
          name: Lidless-zh-Hans-self
          path: |
            dist/Lidless-zh-Hans-self.dmg
            dist/Lidless-zh-Hans-self.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
